<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Invited</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f9fafb;
            margin: 0;
            padding: 0;
            color: #111827;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .header {
            background-color: #0a0a0f;
            padding: 40px 20px;
            text-align: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.025em;
            text-decoration: none;
        }

        .content {
            padding: 40px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 16px;
            color: #111827;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: #4b5563;
            margin-bottom: 32px;
        }

        .button {
            display: inline-block;
            background-color: #4f46e5;
            color: #ffffff !important;
            padding: 16px 32px;
            border-radius: 12px;
            font-weight: 700;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .footer {
            padding: 40px;
            background-color: #f3f4f6;
            text-align: center;
            font-size: 14px;
            color: #9ca3af;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="logo">WordDaily</div>
        </div>
        <div class="content">
            <h1>You've Been Invited!</h1>
            <p>Someone has invited you to join WordDaily, the intelligent vocabulary companion. Accept your invitation
                below to start mastering new words today.</p>
            <a href="{{ .ConfirmationURL }}" class="button">Accept Invitation</a>
        </div>
        <div class="footer">
            <p>If you don't want to join, you can safely ignore this email.</p>
            <p>&copy; 2026 WordDaily. All rights reserved.</p>
        </div>
    </div>
</body>

</html>
